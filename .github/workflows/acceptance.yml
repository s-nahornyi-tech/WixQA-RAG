# The tests that may call the embedding provider and the dataset host. This workflow receives the
# provider key, so it never starts by itself. A person starts it in one of two ways:
#
# - the label "acceptance:example" or "acceptance:full" on a pull request of this repository;
# - the "Run workflow" button, once this file is on the default branch.
#
# Scope "example": every test except those that need the published dataset. After the tests,
# the index "example" is dumped, restored into a second database and audited there: a round
# trip that shows, at no cost, that a snapshot can be restored.
#
# Scope "full": every test. Before the tests, every index recorded under evals/indexes/ is
# restored from its snapshot. The tests marked real_data fetch the published dataset and build
# the index from it, which the provider charges for; an index that was restored is found
# complete, and nothing is embedded. When every test passed and a new index was built, the index
# is audited, dumped and recorded: a release holds the dump, and one commit adds the three record
# files to the branch the run was started for. Nothing is recorded for main.
#
# Scope "full" also records question sets. The real-data tests produce the question sets of the
# study from the published dataset, which calls no provider; a set that is already in the checkout
# is found written, and nothing new appears. When every step succeeded and new files
# evals/golden/<version>.json exist, each is checked with "set check", the lines of the check are
# published, and one commit adds the records to the branch, after the commit of an index record
# when there is one. Nothing is recorded when a step failed: a question set costs nothing to
# produce, and the next run produces it again. Nothing is recorded for main.
#
# Reasons for each choice: specs/001-corpus-and-audit/research.md, sections 3, 4, 6 and 7, and
# specs/002-evaluation-harness/research.md, sections 13 and 14.
# Every action is pinned to a full commit, and the image to a tag and a digest.

name: acceptance

run-name: >-
  acceptance, ${{ inputs.scope && format('scope {0}', inputs.scope)
  || format('label {0}', github.event.label.name) }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "example: every test except those that need the published dataset. full: every test."
        required: true
        type: choice
        default: example
        options:
          - example
          - full
  # The label starts the workflow as it is in the pull request. The event is pull_request, never
  # pull_request_target: a pull request from another repository does not receive the secret.
  pull_request:
    types:
      - labeled

permissions:
  contents: read

# Two runs for one branch never run side by side: a later run waits for the earlier one, in turn.
concurrency:
  group: acceptance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  acceptance:
    name: acceptance tests
    # A label other than the two above starts nothing, and neither does a pull request whose
    # branch is in another repository.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || ((github.event.label.name == 'acceptance:example' || github.event.label.name == 'acceptance:full')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # Set only when this run built a new index and prepared its record; the job "record the
    # index" starts only then.
    outputs:
      index: ${{ steps.prepared.outputs.index }}
      commit: ${{ steps.prepared.outputs.commit }}
      # Set only when this run produced new question sets, every step succeeded and the records
      # were handed over; the job "record the question sets" starts only then. The versions and
      # the SHA-256 of each record, in the same order, separated by spaces.
      question_sets: ${{ steps.prepared_sets.outputs.versions }}
      question_set_sums: ${{ steps.prepared_sets.outputs.sums }}
      question_sets_commit: ${{ steps.prepared_sets.outputs.commit }}

    services:
      # PostgreSQL 18 with pgvector 0.8.7. It accepts connections without a password, is reachable
      # only inside this job and is discarded with it.
      postgres:
        image: pgvector/pgvector:0.8.7-pg18@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wixqa
        ports:
          - 5432:5432
        # The check asks over the network address, not over the local socket: while the container
        # prepares the database it answers on the socket only, and is not ready yet.
        options: >-
          --health-cmd "pg_isready --host 127.0.0.1 --username postgres --dbname wixqa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/wixqa

    steps:
      - name: Read the scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SCOPE: ${{ inputs.scope }}
          LABEL_NAME: ${{ github.event.label.name }}
          # Only "true" or "false" reaches this step, never the key.
          PROVIDER_KEY_IS_SET: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            scope="${INPUT_SCOPE}"
          else
            scope="${LABEL_NAME#acceptance:}"
          fi
          case "${scope}" in
            example | full) ;;
            *)
              echo "::error title=acceptance::The scope is neither example nor full."
              exit 1
              ;;
          esac
          echo "scope=${scope}" >> "${GITHUB_OUTPUT}"
          if [ "${PROVIDER_KEY_IS_SET}" != "true" ]; then
            echo "::warning title=acceptance::The repository secret OPENAI_API_KEY is not set. Every test that calls the embedding provider will fail."
          fi

      # The head of the branch, not the merge commit that GitHub makes for a pull request. For
      # "Run workflow" the value is empty, and the action takes the head of the chosen branch.
      - name: Check out the head of the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Publish the scope and the commit
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: echo "::notice title=acceptance::scope ${SCOPE}, commit $(git rev-parse HEAD)"

      # The uv version comes from the range in pyproject.toml ([tool.uv] required-version).
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Install from the lock file
        id: install
        run: uv sync --locked

      # Scope "full": every index that has a snapshot record in the checkout is brought back
      # before any test runs. The dump is downloaded to a folder outside the checkout and is
      # restored only when its size and its SHA-256 are those of the record. With the index in
      # the store, the build of the real-data tests finds it complete and embeds nothing. The
      # token only reads the release.
      - name: Restore the recorded snapshots
        if: ${{ steps.scope.outputs.scope == 'full' }}
        env:
          GH_TOKEN: ${{ github.token }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash .github/scripts/snapshot.sh restore-recorded "${RUNNER_TEMP}/snapshots"

      # Both scopes run these tests; for the scope "example" they are the whole scope.
      # Only the two steps that run pytest receive the provider key. The reports are written
      # outside the repository.
      - name: Tests that need no published dataset
        id: tests_example
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          uv run pytest -m "not real_data"
          --junit-xml="${RUNNER_TEMP}/junit-example.xml"

      - name: Publish the results of these tests as annotations
        if: ${{ !cancelled() && (steps.tests_example.outcome == 'success' || steps.tests_example.outcome == 'failure') }}
        run: >-
          uv run python .github/scripts/junit_annotations.py
          --name "tests without the published dataset"
          "${RUNNER_TEMP}/junit-example.xml"

      # A build record states whether the checkout differed from its commit when the index was
      # built. The real-data tests may build the real index, so they start only when the
      # checkout is exactly its commit: no file added or changed outside the ignored folders by
      # any step above.
      - name: The checkout is exactly its commit before the real-data tests
        if: ${{ success() && steps.scope.outputs.scope == 'full' }}
        run: bash .github/scripts/check-worktree.sh

      # The scope "full" adds the tests marked real_data, so that both steps together run every
      # test. They run on their own so that the verdict lines of their commands can be told from
      # those of the tests on example data. They start only when every step above succeeded:
      # an index built in a run with a failed test would not be published, and the provider
      # would have been paid for nothing. The output that pytest captures for each test goes
      # into the report.
      #
      # The build of the real index takes many minutes, and its own progress lines reach the log
      # only when its test ends: the test helper holds the output of a command until the command
      # has ended, whatever pytest is told about capturing. So that the job log shows the build
      # moving, a second process asks the store once a minute how large the database is and
      # since when a transaction is open, and prints one line. The build is one transaction, so
      # its rows are not visible from outside before it ends; the size of the database is, and
      # it grows by roughly 7 kB with each passage. At the end a notice states how long the step
      # took.
      - name: Tests on the published dataset
        id: tests_real_data
        if: ${{ success() && steps.scope.outputs.scope == 'full' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          started="$(date +%s)"
          bash .github/scripts/watch-store.sh 60 &
          watcher="$!"
          status=0
          uv run pytest -m "real_data" -o junit_logging=all \
            --junit-xml="${RUNNER_TEMP}/junit-real-data.xml" || status="$?"
          kill "${watcher}" 2> /dev/null || true
          wait "${watcher}" 2> /dev/null || true
          seconds="$(( $(date +%s) - started ))"
          echo "::notice title=timing::The tests on the published dataset took $(( seconds / 60 )) min $(( seconds % 60 )) s. The limit of the whole job is 60 minutes."
          exit "${status}"

      # Failed tests become errors, and the verdict lines of the commands, such as
      # "audit: passed", become a notice. A second notice names each question set that a
      # "set build" reported, with "(already written)" when its record was in the checkout.
      - name: Publish the results and the verdict lines as annotations
        if: ${{ !cancelled() && (steps.tests_real_data.outcome == 'success' || steps.tests_real_data.outcome == 'failure') }}
        run: >-
          uv run python .github/scripts/junit_annotations.py
          --name "tests on the published dataset"
          --verdicts
          "${RUNNER_TEMP}/junit-real-data.xml"

      # In the scope "full" two kinds of file may appear: the build record of a newly built index,
      # evals/indexes/<index>/build.json, and the records of newly produced question sets,
      # evals/golden/<version>.json. A file of either folder that existed and was changed is
      # still reported.
      - name: No file added or changed by the tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          if [ "${SCOPE}" = "full" ]; then
            bash .github/scripts/check-worktree.sh --allow-new-build-record --allow-new-question-sets
          else
            bash .github/scripts/check-worktree.sh
          fi

      # Scope "example", after the tests passed: the round trip of a snapshot, on the versions
      # that the real index uses. The tests leave the index "example" in the store. It is dumped
      # with the pg_dump inside the service container, restored into a second database, and
      # audited there; the audit has to pass. Every file goes to a folder outside the checkout.
      - name: Round trip of a snapshot (dump, restore, audit)
        if: ${{ success() && steps.scope.outputs.scope == 'example' }}
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          folder="${RUNNER_TEMP}/round-trip"
          bash .github/scripts/snapshot.sh dump example "${folder}/example.dump"
          bash .github/scripts/snapshot.sh restore "${folder}/example.dump" wixqa_round_trip
          DATABASE_URL="postgresql://postgres@localhost:5432/wixqa_round_trip" \
            uv run python -m wixqa_rag index audit --data-dir tests/data/example --index example \
            --json "${folder}/audit.json" | tee "${folder}/audit.txt"
          echo "::notice title=round trip of a snapshot::The index example was dumped ($(stat --format=%s "${folder}/example.dump") bytes), restored into a second database and audited there. $(tail -n 1 "${folder}/audit.txt")"

      # Scope "full": was an index built in this run? A new, untracked
      # evals/indexes/<index>/build.json says so. This step and the two after it run whenever
      # the installation worked, also after a failed test: an index that the provider was paid
      # for is always saved, together with the audit result that names every id that differs.
      - name: Look for a newly built index
        id: new_index
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.scope == 'full' }}
        run: |
          found="$(git status --porcelain --untracked-files=all \
            | sed -n -E 's#^\?\? evals/indexes/([a-z0-9]+(-[a-z0-9]+)*)/build\.json$#\1#p')"
          if [ -z "${found}" ]; then
            echo "::notice title=record of an index::No index was built in this run, so there is nothing to save or to record."
            exit 0
          fi
          if [ "$(wc -l <<< "${found}")" -ne 1 ]; then
            echo "::error title=record of an index::More than one index was built in this run: $(tr '\n' ' ' <<< "${found}"). The workflow saves and records one index per run; nothing was saved."
            exit 1
          fi
          echo "index=${found}" >> "${GITHUB_OUTPUT}"

      # Everything goes to a folder outside the checkout: a copy of the build record, the dump,
      # the snapshot record, and the result of an audit made right after the build. The dump
      # comes first, because it is what cannot be made again without paying. A failed audit
      # still leaves its result file, with every id; its first differences become an annotation.
      # The step fails when the audit did not pass or the dump could not be made, after it has
      # written what it could.
      - name: Dump and audit the new index
        id: audit_new_index
        if: ${{ !cancelled() && steps.new_index.outputs.index != '' }}
        env:
          INDEX: ${{ steps.new_index.outputs.index }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          folder="${RUNNER_TEMP}/index-record"
          mkdir -p "${folder}"
          cp "evals/indexes/${INDEX}/build.json" "${folder}/build.json"

          dumped=true
          if bash .github/scripts/snapshot.sh dump "${INDEX}" "${folder}/${INDEX}.dump"; then
            bash .github/scripts/snapshot.sh describe "${INDEX}" "${folder}/${INDEX}.dump" > "${folder}/snapshot.json"
            cat "${folder}/snapshot.json"
          else
            dumped=false
          fi

          code=0
          uv run python -m wixqa_rag index audit --index "${INDEX}" --json "${folder}/audit.json" \
            > "${folder}/audit-output.txt" || code="$?"
          cat "${folder}/audit-output.txt"
          verdict="$(tail -n 1 "${folder}/audit-output.txt")"
          if [ "${code}" -eq 0 ]; then
            echo "::notice title=audit of the new index::${INDEX}: ${verdict}"
          elif [ -f "${folder}/audit.json" ]; then
            # The numbers of ids that differ and the first ten of each list, on separate lines.
            message="$(jq --raw-output '
              def first_of(name; list): "\(name): \(list | length)", (list[:10][] | "  \(tojson)"),
                (if (list | length) > 10 then "  ... and \((list | length) - 10) more" else empty end);
              first_of("missing from index"; .missing_from_index),
              first_of("not in corpus"; .not_in_corpus),
              first_of("unknown question references"; .unknown_references)
            ' "${folder}/audit.json")"
            message="${INDEX}: ${verdict}. Every id is in audit.json of the artifact index-${INDEX} of this run."$'\n'"${message}"
            message="${message//'%'/%25}"
            message="${message//$'\r'/%0D}"
            message="${message//$'\n'/%0A}"
            echo "::error title=audit of the new index::${message}"
          else
            reason="$(grep -m 1 '^reason: ' "${folder}/audit-output.txt" || true)"
            echo "::error title=audit of the new index::${INDEX}: ${verdict}. ${reason}"
          fi

          if [ "${code}" -ne 0 ] || [ "${dumped}" != true ]; then
            exit 1
          fi

      # Saved whenever an index was built, also after a failure, and before anything is
      # published: the dump and the files can be taken from this artifact for 7 days. The dump
      # is compressed already.
      - name: Save the dump, the build record and the audit result as an artifact
        id: saved
        if: ${{ !cancelled() && steps.new_index.outputs.index != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-${{ steps.new_index.outputs.index }}
          path: ${{ runner.temp }}/index-record/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      # An index that was built and is not going to be published: say where it is kept.
      - name: Say where an index that is not published is kept
        if: ${{ failure() && steps.new_index.outputs.index != '' && steps.saved.outcome == 'success' }}
        env:
          INDEX: ${{ steps.new_index.outputs.index }}
        run: echo "::warning title=record of an index::This run built the index ${INDEX} and does not publish it, because a step failed. Its dump, its build record and its audit result are in the artifact index-${INDEX} of this run, kept for 7 days."

      # The index is handed over to be published only when every step of this job succeeded:
      # every test, the audit and the dump. Nothing is recorded for main, which changes only
      # through pull requests: there the run stops here with a message. The record of an index
      # is permanent, so it has to describe a build from the commit alone; the step before the
      # real-data tests makes sure of that, and this one reads what the build wrote. When this
      # step fails, nothing is published, and the artifact above keeps the files.
      - name: Hand the index over to be recorded
        id: prepared
        if: ${{ success() && steps.new_index.outputs.index != '' }}
        env:
          INDEX: ${{ steps.new_index.outputs.index }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${BRANCH}" = "main" ] || { [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${REF_TYPE}" != "branch" ]; }; then
            echo "::error title=record of an index::This run built the index ${INDEX}, and it is not recorded: a record is added only to a branch other than main, because main changes only through pull requests. Build a new index on a branch; it reaches main through its pull request. The dump and the files are in the artifact index-${INDEX} of this run."
            exit 1
          fi
          if [ "$(jq '.uncommitted_changes' "${RUNNER_TEMP}/index-record/build.json")" != "false" ]; then
            echo "::error title=record of an index::The build record of ${INDEX} does not state \"uncommitted_changes\": false, so the index is not recorded. The dump and the record files are in the artifact index-${INDEX} of this run."
            exit 1
          fi
          echo "index=${INDEX}" >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # Scope "full": were question sets produced in this run? New, untracked files
      # evals/golden/<version>.json say so. The version has the form of an index identifier and
      # at most 40 characters; a new .json file of that folder with any other name is an error,
      # and nothing is recorded. The step runs whenever the installation worked, so that every
      # run of the scope says what it found.
      - name: Look for new question sets
        id: new_sets
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.scope.outputs.scope == 'full' }}
        run: |
          any_record='^\?\? "?(evals/golden/[^/]*\.json)"?$'
          valid_record='^\?\? evals/golden/([a-z0-9]+(-[a-z0-9]+)*)\.json$'
          versions=""
          invalid=""
          while IFS= read -r line; do
            [[ "${line}" =~ ${any_record} ]] || continue
            file="${BASH_REMATCH[1]}"
            if [[ "${line}" =~ ${valid_record} ]] && [ "${#BASH_REMATCH[1]}" -le 40 ]; then
              versions+="${versions:+ }${BASH_REMATCH[1]}"
            else
              invalid+="${invalid:+, }${file}"
            fi
          done <<< "$(git status --porcelain --untracked-files=all -- evals/golden)"
          if [ -n "${invalid}" ]; then
            echo "::error title=record of the question sets::New in evals/golden/ and not named by a valid version of a question set: ${invalid}. Nothing is recorded."
            exit 1
          fi
          if [ -z "${versions}" ]; then
            echo "::notice title=record of the question sets::No question set was produced in this run, so there is nothing to check or to record."
            exit 0
          fi
          echo "New question sets: ${versions}"
          echo "versions=${versions}" >> "${GITHUB_OUTPUT}"

      # Only when every step above succeeded: every test, and for a new index its audit and its
      # dump. The records are copied to a folder outside the checkout, and each is checked
      # against the dataset with "set check". The lines of each check, among them the numbers of
      # single-article and multi-article questions, become a notice and a part of the summary
      # page; a check that does not pass becomes an error, and the step fails after every set
      # was checked. The command reads no setting, and the step receives no secret.
      - name: Check the new question sets
        id: checked_sets
        if: ${{ success() && steps.new_sets.outputs.versions != '' }}
        env:
          VERSIONS: ${{ steps.new_sets.outputs.versions }}
        run: |
          folder="${RUNNER_TEMP}/question-sets"
          outputs="${RUNNER_TEMP}/question-set-checks"
          mkdir -p "${folder}" "${outputs}"
          for version in ${VERSIONS}; do
            cp "evals/golden/${version}.json" "${folder}/${version}.json"
          done

          # One annotation per check; a line break inside a workflow command is written as %0A.
          annotate() {
            local message="$3"
            message="${message//'%'/%25}"
            message="${message//$'\r'/%0D}"
            message="${message//$'\n'/%0A}"
            echo "::$1 title=$2::${message}"
          }

          failed=""
          sums=""
          for version in ${VERSIONS}; do
            result="${outputs}/${version}.txt"
            code=0
            uv run python -m wixqa_rag set check --version "${version}" > "${result}" || code="$?"
            cat "${result}"
            verdict="$(tail -n 1 "${result}")"
            if [ "${code}" -eq 0 ] && [ "${verdict}" = "set check: passed" ]; then
              annotate notice "check of the question set ${version}" "$(cat "${result}")"
            else
              # The report and the first twenty lines that name a difference or a reason.
              report="$(grep --invert-match -E '^(difference|reason): ' "${result}" || true)"
              named="$(grep -E '^(difference|reason): ' "${result}" || true)"
              count="$(grep --count -E '^(difference|reason): ' "${result}" || true)"
              message="exit code ${code}"$'\n'"${report:-The command printed no result line; what it wrote as an error is in the log of this step.}"
              if [ "${count}" -gt 0 ]; then
                message+=$'\n'"$(head -n 20 <<< "${named}")"
              fi
              if [ "${count}" -gt 20 ]; then
                message+=$'\n'"... and $(( count - 20 )) more; every line is in the log of this step"
              fi
              annotate error "check of the question set ${version}" "${message}"
              failed+="${failed:+, }${version}"
            fi
            {
              echo "### Check of the question set ${version}"
              echo
              echo '```text'
              cat "${result}"
              echo '```'
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
            if ! cmp --silent "evals/golden/${version}.json" "${folder}/${version}.json"; then
              annotate error "check of the question set ${version}" "evals/golden/${version}.json changed while it was checked. Nothing is recorded."
              failed+="${failed:+, }${version}"
            fi
            sum="$(sha256sum "${folder}/${version}.json" | cut --delimiter=' ' --fields=1)"
            echo "SHA-256 of ${version}.json: ${sum}"
            sums+="${sums:+ }${sum}"
          done

          if [ -n "${failed}" ]; then
            echo "::error title=record of the question sets::The check did not pass for: ${failed}. Nothing is recorded."
            exit 1
          fi
          echo "sums=${sums}" >> "${GITHUB_OUTPUT}"

      # The records as they were checked, for the job that adds them to the branch.
      - name: Save the question-set records as an artifact
        if: ${{ success() && steps.new_sets.outputs.versions != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: question-sets
          path: ${{ runner.temp }}/question-sets/
          retention-days: 7
          if-no-files-found: error

      # Question sets that were produced and are not going to be recorded: say so. Nothing has to
      # be kept, because the same dataset, rule and seed give the same record again.
      - name: Say that question sets are not recorded
        if: ${{ failure() && steps.new_sets.outputs.versions != '' }}
        env:
          VERSIONS: ${{ steps.new_sets.outputs.versions }}
        run: echo "::warning title=record of the question sets::This run produced the question sets ${VERSIONS} and does not record them, because a step failed. Nothing is lost - the next run produces them again."

      # The records are handed over only when every step of this job succeeded: every test, every
      # check of a new set and, when an index was built, its audit and its dump. Nothing is
      # recorded for main, which changes only through pull requests: there the run stops here
      # with a message.
      - name: Hand the question sets over to be recorded
        id: prepared_sets
        if: ${{ success() && steps.new_sets.outputs.versions != '' }}
        env:
          VERSIONS: ${{ steps.new_sets.outputs.versions }}
          SUMS: ${{ steps.checked_sets.outputs.sums }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${BRANCH}" = "main" ] || { [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${REF_TYPE}" != "branch" ]; }; then
            echo "::error title=record of the question sets::This run produced the question sets ${VERSIONS}, and they are not recorded: a record is added only to a branch other than main, because main changes only through pull requests. Produce a new question set on a branch; it reaches main through its pull request."
            exit 1
          fi
          {
            echo "versions=${VERSIONS}"
            echo "sums=${SUMS}"
            echo "commit=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

  # Runs only when the tests passed and a new index was built and prepared. It creates the
  # release with the dump and adds the three record files to the branch in one commit. Only it
  # and the job "record the question sets" may write to the contents of the repository, and it
  # runs no code of the repository: it copies files and calls git and gh. It never runs for main.
  record-index:
    name: record the index
    needs: acceptance
    if: >-
      ${{ needs.acceptance.result == 'success'
      && needs.acceptance.outputs.index != ''
      && (github.head_ref || github.ref_name) != 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      INDEX: ${{ needs.acceptance.outputs.index }}
      COMMIT: ${{ needs.acceptance.outputs.commit }}
      BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Fetch the dump and the record files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: index-${{ needs.acceptance.outputs.index }}
          path: ${{ runner.temp }}/index-record

      - name: Compare the dump with its record
        run: |
          folder="${RUNNER_TEMP}/index-record"
          [[ "${INDEX}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] && [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error title=record of an index::The index identifier or the commit handed over is not valid."
            exit 1
          }
          for file in build.json audit.json snapshot.json "${INDEX}.dump"; do
            [ -f "${folder}/${file}" ] || {
              echo "::error title=record of an index::The artifact lacks ${file}."
              exit 1
            }
          done
          recorded="$(jq --raw-output '.sha256' "${folder}/snapshot.json")"
          actual="$(sha256sum "${folder}/${INDEX}.dump" | cut --delimiter=' ' --fields=1)"
          if [ "${recorded}" != "${actual}" ]; then
            echo "::error title=record of an index::The dump does not have the SHA-256 that snapshot.json records. Nothing was published."
            exit 1
          fi
          if [ "$(jq --raw-output '.outcome' "${folder}/audit.json")" != "passed" ]; then
            echo "::error title=record of an index::The audit of the index ${INDEX} did not pass. Nothing was published."
            exit 1
          fi

      # The tag of the release is put on the commit the index was built from.
      - name: Create the release with the dump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release create "index-${INDEX}" "${RUNNER_TEMP}/index-record/${INDEX}.dump" \
            --repo "${GITHUB_REPOSITORY}" --target "${COMMIT}" --latest=false \
            --title "Index ${INDEX}" \
            --notes "The snapshot of the index ${INDEX}: a dump of its schema in pg_dump's custom format, made by workflow run ${GITHUB_RUN_ID} from commit ${COMMIT}. Its record is evals/indexes/${INDEX}/snapshot.json."; then
            echo "::error title=record of an index::The release index-${INDEX} could not be created. The dump and the record files are in the artifact index-${INDEX} of this run, kept for 7 days."
            exit 1
          fi
          echo "::notice title=record of an index::The release index-${INDEX} holds ${INDEX}.dump."

      - name: Check out the commit the index was built from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.acceptance.outputs.commit }}

      # One commit with the three record files, pushed to the branch the run was started for.
      # The push is refused when the branch has moved since the run started; then the files stay
      # in the artifact and are added by hand.
      - name: Commit the three record files to the branch
        run: |
          folder="${RUNNER_TEMP}/index-record"
          mkdir -p "evals/indexes/${INDEX}"
          cp "${folder}/build.json" "${folder}/audit.json" "${folder}/snapshot.json" "evals/indexes/${INDEX}/"
          git add -- "evals/indexes/${INDEX}/build.json" "evals/indexes/${INDEX}/audit.json" "evals/indexes/${INDEX}/snapshot.json"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "chore(evals): record the index ${INDEX} (workflow run ${GITHUB_RUN_ID})"
          if ! git push origin "HEAD:refs/heads/${BRANCH}"; then
            echo "::error title=record of an index::The commit with the record files could not be pushed to ${BRANCH}. The release index-${INDEX} exists; the three record files are in the artifact index-${INDEX} of this run, kept for 7 days, and have to be added to evals/indexes/${INDEX}/ by hand."
            exit 1
          fi
          echo "::notice title=record of an index::Commit $(git rev-parse HEAD) on ${BRANCH} adds build.json, audit.json and snapshot.json of the index ${INDEX}."

  # Runs only when the job with the tests succeeded and handed new question sets over, and when
  # the job "record the index" succeeded or had nothing to record: it comes after that job, so
  # that two pushes never race. It adds the records to the branch in one commit. It alone, with
  # the job "record the index", may write to the contents of the repository, and it runs no
  # code of the repository: it copies files and calls git. It never runs for main.
  record-question-sets:
    name: record the question sets
    needs: [acceptance, record-index]
    if: >-
      ${{ !cancelled()
      && needs.acceptance.result == 'success'
      && needs.acceptance.outputs.question_sets != ''
      && (needs.record-index.result == 'success' || needs.record-index.result == 'skipped')
      && (github.head_ref || github.ref_name) != 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSIONS: ${{ needs.acceptance.outputs.question_sets }}
      SUMS: ${{ needs.acceptance.outputs.question_set_sums }}
      COMMIT: ${{ needs.acceptance.outputs.question_sets_commit }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      INDEX_RECORDED: ${{ needs.record-index.result == 'success' }}

    steps:
      - name: Fetch the question-set records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: question-sets
          path: ${{ runner.temp }}/question-sets

      # The artifact has to hold exactly the records that were handed over, each with the bytes
      # that were checked and with its own version inside.
      - name: Compare the records with what was checked
        run: |
          folder="${RUNNER_TEMP}/question-sets"
          stop() {
            echo "::error title=record of the question sets::$1 Nothing was recorded."
            exit 1
          }
          [ "${BRANCH}" != "main" ] || stop "The branch is main."
          [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]] || stop "The commit handed over is not valid."
          read -r -a versions <<< "${VERSIONS}"
          read -r -a sums <<< "${SUMS}"
          [ "${#versions[@]}" -ge 1 ] && [ "${#versions[@]}" -eq "${#sums[@]}" ] \
            || stop "The versions and the SHA-256 values handed over do not belong together."
          for position in "${!versions[@]}"; do
            version="${versions[${position}]}"
            [[ "${version}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] && [ "${#version}" -le 40 ] \
              || stop "A version handed over is not a valid version of a question set."
            [[ "${sums[${position}]}" =~ ^[0-9a-f]{64}$ ]] || stop "A SHA-256 handed over is not valid."
            [ -f "${folder}/${version}.json" ] || stop "The artifact lacks ${version}.json."
            actual="$(sha256sum "${folder}/${version}.json" | cut --delimiter=' ' --fields=1)"
            [ "${actual}" = "${sums[${position}]}" ] \
              || stop "${version}.json of the artifact does not have the SHA-256 of the record that was checked."
            [ "$(jq --raw-output '.version' "${folder}/${version}.json")" = "${version}" ] \
              || stop "${version}.json does not state the version ${version}."
          done
          [ "$(find "${folder}" -mindepth 1 | wc -l)" -eq "${#versions[@]}" ] \
            || stop "The artifact holds more than the records that were handed over."

      # The head of the branch with its parent. The name is given as a branch, so that nothing
      # else can be checked out under it.
      - name: Check out the head of the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.head_ref || github.ref_name }}
          fetch-depth: 2

      # One commit with the records, pushed to the branch the run was started for. The head of
      # the branch has to be the commit of the tests or, when this run recorded an index, the one
      # commit that the job "record the index" put on top of it. A record that is already on the
      # branch is never replaced. When the branch has moved, nothing is pushed; the records stay
      # in the artifact, and the next run produces them again.
      - name: Commit the records to the branch
        run: |
          folder="${RUNNER_TEMP}/question-sets"
          stop() {
            echo "::error title=record of the question sets::$1 Nothing was recorded. The records are in the artifact question-sets of this run, kept for 7 days; the next run of the scope full produces them again."
            exit 1
          }
          read -r -a versions <<< "${VERSIONS}"

          head="$(git rev-parse HEAD)"
          if [ "${INDEX_RECORDED}" = "true" ]; then
            parents="$(git rev-list --parents --max-count=1 HEAD)"
            [ "${parents}" = "${head} ${COMMIT}" ] \
              || stop "The head of ${BRANCH} is ${head}, which is not one commit on top of ${COMMIT}, the commit of the tests: the branch has moved since the run started."
            other="$(git diff --name-only "${COMMIT}" HEAD \
              | grep --invert-match -E '^evals/indexes/[a-z0-9]+(-[a-z0-9]+)*/(build|audit|snapshot)\.json$' || true)"
            [ -z "${other}" ] \
              || stop "The head of ${BRANCH}, ${head}, changes more than the record files of an index: the branch has moved since the run started."
          else
            [ "${head}" = "${COMMIT}" ] \
              || stop "The head of ${BRANCH} is ${head}, not ${COMMIT}, the commit of the tests: the branch has moved since the run started."
          fi

          mkdir -p evals/golden
          files=()
          for version in "${versions[@]}"; do
            [ ! -e "evals/golden/${version}.json" ] \
              || stop "evals/golden/${version}.json is already on ${BRANCH}; a recorded question set is never replaced."
            cp "${folder}/${version}.json" "evals/golden/${version}.json"
            files+=("evals/golden/${version}.json")
          done
          git add -- "${files[@]}"
          staged="$(git status --porcelain --untracked-files=all)"
          expected="$(printf 'A  %s\n' "${files[@]}" | LC_ALL=C sort)"
          [ "$(LC_ALL=C sort <<< "${staged}")" = "${expected}" ] \
            || stop "The commit would hold something else than the new records."

          list="$(printf '%s, ' "${versions[@]}")"
          list="${list%, }"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "chore(evals): record the question sets ${list} (workflow run ${GITHUB_RUN_ID})"
          if ! git push origin "HEAD:refs/heads/${BRANCH}"; then
            stop "The commit with the records could not be pushed to ${BRANCH}."
          fi
          echo "::notice title=record of the question sets::Commit $(git rev-parse HEAD) on ${BRANCH} adds the records of the question sets ${list} to evals/golden/."

  # The label is removed when the run finishes, also after a failure, so that adding it again
  # starts the next run. This job runs no code of the repository, and it alone may write to the
  # pull request.
  remove-label:
    name: remove the label
    needs: [acceptance, record-index, record-question-sets]
    if: >-
      ${{ always()
      && github.event_name == 'pull_request'
      && (github.event.label.name == 'acceptance:example' || github.event.label.name == 'acceptance:full')
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Remove the label that started this run
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        run: |
          # In the address of the label, the colon is written as %3A.
          address="repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST}/labels/${LABEL/:/%3A}"
          if problem="$(gh api --method DELETE "${address}" 2>&1 > /dev/null)"; then
            echo "::notice title=acceptance::The label ${LABEL} was removed. Add it again to start the next run."
          elif grep --quiet "HTTP 404" <<< "${problem}"; then
            echo "::notice title=acceptance::The label ${LABEL} was no longer on the pull request."
          else
            echo "${problem}"
            echo "::error title=acceptance::The label ${LABEL} could not be removed. Remove it by hand; adding it again then starts the next run."
            exit 1
          fi
